name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [transcription, orchestration, chat, calendar, export, storage]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  error-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bahlily-logging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run bahlily-logging-check-catalog --catalog ../../error-catalog.yaml --scan-root ../..

  orchestration-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Install Ollama
        run: |
          curl -fsSL -o /tmp/ollama_install.sh https://ollama.com/install.sh
          chmod +x /tmp/ollama_install.sh
          /tmp/ollama_install.sh
      - name: Start Ollama and pull judge model
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && break
            sleep 1
          done
          ollama pull qwen2.5:7b
      - run: uv sync --group eval
      - run: uv run pytest eval/ -v
