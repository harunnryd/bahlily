name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same PR; let main runs complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Detects which parts of the repo changed so downstream jobs can skip
  # when their paths are unaffected.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      catalog: ${{ steps.filter.outputs.catalog }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'shell/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            python:
              - 'services/**'
              - 'packages/**'
            catalog:
              - 'packages/bahlily-logging/**'
              - 'error-catalog.yaml'
              - 'services/**'
            orchestration:
              - 'services/orchestration/**'
              - 'packages/bahlily-logging/**'
            workflow:
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'

  validate-workflows:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: |
          set -euo pipefail
          uvx pre-commit run actionlint --all-files
          uvx pre-commit run zizmor --all-files

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  discover-services:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: list
        run: |
          services=$(find services -maxdepth 2 -name pyproject.toml \
            -exec sh -c 'basename "$(dirname "$1")"' _ {} \; |
            sort | jq -R . | jq -sc .)
          echo "services=$services" >> "$GITHUB_OUTPUT"

  python:
    needs: [changes, discover-services]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "services/${{ matrix.service }}/uv.lock"
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  error-catalog:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/bahlily-logging
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "packages/bahlily-logging/uv.lock"
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run bahlily-logging-check-catalog --catalog ../../error-catalog.yaml --scan-root ../..

  orchestration-eval:
    needs: changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.orchestration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/orchestration
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "services/orchestration/uv.lock"
      - name: Cache Ollama models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b
      - name: Install Ollama
        env:
          OLLAMA_VERSION: "0.32.5"
          OLLAMA_INSTALL_SHA256: "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ollama_install.sh \
            "https://raw.githubusercontent.com/ollama/ollama/v${OLLAMA_VERSION}/scripts/install.sh"
          echo "${OLLAMA_INSTALL_SHA256}  /tmp/ollama_install.sh" | sha256sum -c
          chmod +x /tmp/ollama_install.sh
          /tmp/ollama_install.sh
      - name: Start Ollama and pull judge model
        run: |
          set -euo pipefail
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "Ollama did not become ready after 30s" >&2
              exit 1
            fi
            sleep 1
          done
          ollama pull qwen2.5:7b
      - run: uv sync --group eval
      - run: uv run pytest eval/ -v
