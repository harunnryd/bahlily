- code: AUDIO_CAPTURE_DEVICE_LOST
  domain: audio-capture
  severity: error
  description: Mic or system audio device disconnected or became unavailable mid-recording.
- code: AUDIO_CAPTURE_STREAM_ERROR
  domain: audio-capture
  severity: error
  description: cpal/CoreAudio input stream reported an error.
- code: AUDIO_VAD_MODEL_LOAD_FAILED
  domain: audio-vad
  severity: error
  description: Silero ONNX model failed to load from disk.
- code: AUDIO_VAD_PROCESSING_FAILED
  domain: audio-vad
  severity: warn
  description: Silero VAD failed to process a frame; the frame is treated as non-speech.
- code: AUDIO_SEGMENT_DROPPED
  domain: audio-core
  severity: warn
  description: A speech segment was dropped because the gRPC streaming channel was full or closed.
- code: AUDIO_STREAM_LAGGED
  domain: audio-grpc
  severity: warn
  description: A gRPC client fell behind the broadcast segment stream and skipped segments.
- code: TRANSCRIPTION_MODEL_NOT_LOADED
  domain: transcription
  severity: error
  description: A transcription session was started but no model has been loaded into the requested engine.
- code: TRANSCRIPTION_AUDIO_TOO_SHORT
  domain: transcription
  severity: warn
  description: An audio segment shorter than 0.5 s was submitted for transcription; it was skipped.
- code: TRANSCRIPTION_ENGINE_FAILED
  domain: transcription
  severity: error
  description: The transcription engine raised an error during inference and exhausted its retry budget.
- code: TRANSCRIPTION_UNSUPPORTED_LANGUAGE
  domain: transcription
  severity: error
  description: Parakeet was requested for a non-English language it does not support.
- code: TRANSCRIPTION_MODEL_NOT_FOUND
  domain: transcription
  severity: error
  description: The requested model name does not appear in the engine manifest.
- code: TRANSCRIPTION_ALREADY_DOWNLOADING
  domain: transcription
  severity: warn
  description: A download was requested for a model that is already being downloaded.
- code: TRANSCRIPTION_INSUFFICIENT_DISK
  domain: transcription
  severity: error
  description: Not enough free disk space to download the requested model.
- code: TRANSCRIPTION_CHECKSUM_FAILED
  domain: transcription
  severity: error
  description: SHA-256 verification of a downloaded model file failed; the file has been removed.
- code: ORCHESTRATION_UNSUPPORTED_PROVIDER
  domain: orchestration
  severity: error
  description: The requested LLM provider string does not match a supported integration.
- code: ORCHESTRATION_PROVIDER_AUTH_FAILED
  domain: orchestration
  severity: error
  description: The selected LLM provider rejected the request due to a missing or invalid API key.
- code: ORCHESTRATION_PROVIDER_UNAVAILABLE
  domain: orchestration
  severity: error
  description: The selected LLM provider was unreachable or timed out after retries were exhausted.
- code: ORCHESTRATION_STRUCTURED_OUTPUT_FAILED
  domain: orchestration
  severity: error
  description: The model could not produce a schema-valid summary within the bounded retry budget.
- code: CHAT_MEETING_NOT_INGESTED
  domain: chat
  severity: error
  description: The requested meeting ID has not been ingested into the chat index.
- code: CHAT_UNSUPPORTED_PROVIDER
  domain: chat
  severity: error
  description: The requested LLM provider string does not match a supported integration.
- code: CHAT_UNSUPPORTED_EMBEDDING_PROVIDER
  domain: chat
  severity: error
  description: The configured embedding provider does not match a supported integration.
- code: CHAT_PROVIDER_AUTH_FAILED
  domain: chat
  severity: error
  description: The selected LLM or embedding provider rejected the request due to a missing or invalid API key.
- code: CHAT_PROVIDER_UNAVAILABLE
  domain: chat
  severity: error
  description: The selected LLM or embedding provider was unreachable or timed out after retries were exhausted.
- code: CHAT_STORAGE_ERROR
  domain: chat
  severity: error
  description: The local sqlite-vec index rejected a write (e.g. a stored vector's dimension no longer matches the configured embedding dimension), distinct from the LLM/embedding provider being unavailable.
- code: CALENDAR_RESERVED
  domain: calendar
  severity: info
  description: Placeholder namespace reserved for the calendar service; no real codes emitted yet.
- code: EXPORT_RESERVED
  domain: export
  severity: info
  description: Placeholder namespace reserved for the export service; no real codes emitted yet.
- code: STORAGE_MEETING_NOT_FOUND
  domain: storage
  severity: error
  description: The requested meeting ID does not exist in storage.
- code: STORAGE_MEETING_ALREADY_EXISTS
  domain: storage
  severity: error
  description: A meeting with the given ID already exists; use PATCH to update it.
- code: STORAGE_SUMMARY_NOT_FOUND
  domain: storage
  severity: error
  description: The meeting exists but has no summary yet.
- code: STORAGE_SUMMARY_ALREADY_EXISTS
  domain: storage
  severity: error
  description: A summary already exists for this meeting; delete it first to replace.
- code: STORAGE_TEMPLATE_NOT_FOUND
  domain: storage
  severity: error
  description: The requested custom summary template ID does not exist in storage.
- code: STORAGE_SPEAKER_PROFILE_NOT_FOUND
  domain: storage
  severity: error
  description: The requested speaker profile ID does not exist in storage.
- code: STORAGE_SPEAKER_PROFILE_NAME_CONFLICT
  domain: storage
  severity: error
  description: A speaker profile with the given name already exists; pick a different name.
- code: STORAGE_EMBEDDING_DIM_NOT_CONFIGURED
  domain: storage
  severity: error
  description: BAHLILY_STORAGE_EMBEDDING_DIM env var is required to validate voice embedding dimensions on speaker-profile endpoints.
- code: TRANSCRIPTION_DIARIZATION_UNAVAILABLE
  domain: transcription
  severity: error
  description: A diarization job was requested but BAHLILY_TRANSCRIPTION_HF_TOKEN is not configured.
- code: TRANSCRIPTION_DIARIZATION_FAILED
  domain: transcription
  severity: error
  description: The pyannote diarization pipeline raised an error while processing a recording.
- code: TRANSCRIPTION_JOB_NOT_FOUND
  domain: transcription
  severity: error
  description: The requested diarization job ID does not exist.
- code: AUDIO_RECORDING_FINALIZE_FAILED
  domain: audio-core
  severity: error
  description: Failed to finalize the recording file (write the FLAC header/footer) while dropping a session that was never explicitly stopped.
- code: AUDIO_RECORDING_WRITE_FAILED
  domain: audio-core
  severity: error
  description: A local disk-write failure occurred while writing mixed samples to the recording file; the pairing loop continues rather than aborting.
- code: AUDIO_GRPC_NON_LOOPBACK_BIND
  domain: audio-grpc
  severity: warn
  description: The audio-core gRPC server was configured to bind to a non-loopback address, exposing unauthenticated, unencrypted microphone and system audio.
- code: AUDIO_GRPC_SERVER_FAILED
  domain: audio-grpc
  severity: error
  description: The audio-core gRPC server exited unexpectedly after successfully binding.
- code: AUDIO_GRPC_BIND_FAILED
  domain: audio-grpc
  severity: error
  description: The audio-core gRPC server failed to bind its configured address at startup; recording to disk still works, but gRPC streaming is unavailable.
