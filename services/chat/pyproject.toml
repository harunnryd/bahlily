[project]
name = "bahlily-chat"
version = "0.1.0"
description = "RAG chat over meeting transcripts"
authors = [
    { name = "Harun", email = "harun.sigmawaveai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bahlily-chat = "bahlily_chat:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
