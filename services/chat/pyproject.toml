[project]
name = "bahlily-chat"
version = "0.1.0"
description = "Retrieval-augmented chat over meeting transcripts (sqlite-vec + multi-provider embeddings/LLM)"
authors = [{ name = "Harun", email = "harun.sigmawaveai@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "bahlily-logging>=0.1.0",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "sqlite-vec>=0.1.9",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
]

[tool.uv.sources]
bahlily-logging = { path = "../../packages/bahlily-logging" }

[project.scripts]
bahlily-chat = "bahlily_chat:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "mypy>=1.13", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true
