[project]
name = "bahlily-export"
version = "0.1.0"
description = "Structured summary to Markdown/DOCX/PDF export"
authors = [{ name = "Harun", email = "harun.sigmawaveai@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "python-docx>=1.2.0",
    "reportlab>=4.5.1",
]

[project.scripts]
bahlily-export = "bahlily_export:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "mypy>=1.13",
    "httpx>=0.28",
    "pypdf>=6.14.2",
    "types-reportlab>=4.5.1.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
