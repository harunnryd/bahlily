[project]
name = "bahlily-orchestration"
version = "0.1.0"
description = "LangChain/LangGraph summarization, prompt templates, multi-provider LLM orchestration, DeepEval"
authors = [
    { name = "Harun", email = "harun.sigmawaveai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13.4"]

[project.scripts]
bahlily-orchestration = "bahlily_orchestration:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
