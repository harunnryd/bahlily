[project]
name = "bahlily-orchestration"
version = "0.1.0"
description = "LangChain/LangGraph summarization, prompt templates, multi-provider LLM orchestration, DeepEval"
authors = [
    { name = "Harun", email = "harun.sigmawaveai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "bahlily-logging",
    "pyyaml>=6.0.3",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "langchain-anthropic>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.uv.sources]
bahlily-logging = { path = "../../packages/bahlily-logging" }

[project.scripts]
bahlily-orchestration = "bahlily_orchestration:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
