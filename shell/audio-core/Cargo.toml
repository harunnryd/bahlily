[package]
name = "audio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "audio_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
thiserror = "1"
hound = "3.5"
tokio-stream = "0.1"
# cidre = { git = "https://github.com/yury/cidre" }
silero_rs = { git = "https://github.com/emotechlab/silero-rs", package = "silero" }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
