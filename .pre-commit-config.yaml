repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Lints GitHub Actions workflow YAML for syntax and logic errors.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Audits GitHub Actions workflows for security issues (unpinned actions,
  # dangerous patterns, permission escalations).
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: branch-name-check
        name: branch name convention
        entry: bash -c 'branch=$(git symbolic-ref --short HEAD 2>/dev/null); case "$branch" in main|HEAD) exit 0;; esac; echo "$branch" | grep -qE "^(feat|fix|docs|refactor|test|chore|style|perf)/.+" || { echo "branch name \"$branch\" must match type/short-desc (e.g. feat/add-login, fix/null-crash)" >&2; exit 1; }'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: conventional-commit-msg
        name: conventional commit message
        entry: '^(feat|fix|docs|refactor|test|chore|style|perf)(\([a-z0-9-]+\))?: [a-z].{0,68}$'
        language: pygrep
        stages: [commit-msg]
        args: [--multiline, --negate]

      # Runs mypy in every Python service and package that changed in this
      # push. Skipped for a service if its venv is not yet set up. Run
      # `uv sync` inside the service directory to set it up.
      - id: mypy-services
        name: mypy (changed Python services)
        entry: scripts/mypy-push-check.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
