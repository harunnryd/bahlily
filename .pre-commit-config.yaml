repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: branch-name-check
        name: branch name convention
        entry: bash -c 'branch=$(git symbolic-ref --short HEAD 2>/dev/null || echo "HEAD"); case "$branch" in main|HEAD) exit 0;; esac; echo "$branch" | grep -qE "^(feat|fix|docs|refactor|test|chore|style|perf)/[a-z0-9][a-z0-9-]*$" || { echo "branch name \"$branch\" must match type/short-desc (e.g. feat/add-login, fix/null-crash)" >&2; exit 1; }'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: conventional-commit-msg
        name: conventional commit message
        entry: '\A(feat|fix|docs|refactor|test|chore|style|perf)(\([a-z0-9-]+\))?: [a-z][^A-Z.\n]{0,67}(\n[\s\S]*)?\Z'
        language: pygrep
        stages: [commit-msg]
        args: [--multiline, --negate]

      # Fails if a changed service or package has no .venv; run `uv sync` first.
      - id: mypy-services
        name: mypy (changed Python services)
        entry: scripts/mypy-push-check.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # Opt-in only: requires `coderabbit auth login` per contributor, so it
      # never runs on a normal commit. Invoke with:
      #   pre-commit run --hook-stage manual coderabbit-review
      - id: coderabbit-review
        name: coderabbit review (manual)
        entry: coderabbit review --uncommitted
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
