[project]
name = "bahlily-capability"
version = "0.1.0"
description = "Shared per-launch capability-token helpers for bahlily services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
